name = "newspaper-email-inbox"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[vars]
GITHUB_REPO   = "israel2176/newspaper-system"
GITHUB_BRANCH = "master"
# Optional: also forward every email to this (verified) address, e.g. your personal mailbox
FORWARD_TO = ""

# Secrets (set by the "Deploy email worker" workflow from GitHub secrets, never here):
#   GITHUB_TOKEN     — token that can write to the repository
#   ALLOWED_SENDERS  — comma-separated sender addresses allowed to publish
